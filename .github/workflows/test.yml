name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest
      - name: Check GDB
        run: |
          which gdb || true
          gdb --version || true
          echo "PATH=$PATH"
          ls -l /usr/bin/gdb 2>/dev/null || true

      - name: Run Tests
        run: ./test.py
